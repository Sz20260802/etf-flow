name: 每日数据更新

# 每个交易日北京时间 21:30（UTC 13:30，份额+净值均已发布）和
# 北京时间 10:00（UTC 2:00，兜底）各跑一次；也可在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 允许上传 Release 资产

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行每日采集
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 daily_update.py

      - name: 记录数据版本（行情日期）
        run: |
          python3 -c "
          import sqlite3
          c = sqlite3.connect('data/quotes.db')
          d = c.execute('SELECT MAX(trade_date) FROM etf_quote_daily').fetchone()[0]
          open('data_version.txt','w').write(d or '')
          print('行情日期:', d)"

      - name: 发布最新数据库到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-data --title "最新数据库" --notes "自动更新" 2>/dev/null || true
          gh release upload latest-data data/etf.db data/quotes.db data_version.txt --clobber
