name: 每日数据更新

on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载上次Release数据库并自检
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download latest-data -p "etf.db" -p "quotes.db" --dir data --clobber
          echo "--- data 目录内容 ---"
          ls -la data/
          python3 -c "
          import sqlite3, os
          for f in ('data/etf.db', 'data/quotes.db'):
              if not os.path.exists(f):
                  print(f, '不存在（会失败）'); raise SystemExit(1)
              c = sqlite3.connect(f)
              try:
                  d = c.execute('SELECT MAX(trade_date) FROM etf_share_daily WHERE shares IS NOT NULL').fetchone()[0]
                  print(f, '份额最大日:', d)
              except Exception as e:
                  print(f, '无份额表或查询失败:', e)
              try:
                  q = c.execute('SELECT MAX(trade_date) FROM etf_quote_daily').fetchone()[0]
                  print(f, '行情最大日:', q)
              except Exception as e:
                  print(f, '无行情表或查询失败:', e)
          "

      - name: 运行每日采集
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 daily_update.py

      - name: 生成日报（L2：每日自动产出，供AI分析）
        run: |
          python3 -c "
          from report import generate_report
          open('日报.txt','w',encoding='utf-8').write(generate_report())
          print('日报已生成:')
          print(open('日报.txt',encoding='utf-8').read()[:500])
          "

      - name: 记录数据版本（行情日期）
        run: |
          python3 -c "
          import sqlite3
          c = sqlite3.connect('data/quotes.db')
          d = c.execute('SELECT MAX(trade_date) FROM etf_quote_daily').fetchone()[0]
          open('data_version.txt','w').write(d or '')
          print('行情日期:', d)"

      - name: 发布最新数据库与日报到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-data --title "最新数据库" --notes "自动更新" 2>/dev/null || true
          gh release upload latest-data data/etf.db data/quotes.db data_version.txt 日报.txt --clobber
